; Robosapiens RSI-05 ATmega8A profile

[env:atmega8]
platform = atmelavr@5.3.0
board = atmegangatmega8
framework = arduino

; Match the board's factory oscillator frequency.
board_build.f_cpu = 12000000L

; The RBoard uses USB HID, not a serial port. Upload with BootloadHID.
upload_protocol = custom
upload_command = tools/bootloadHID -r "$SOURCE"

; Reserve the upper 2 KB bootloader area in the 8 KB ATmega8 flash.
board_upload.maximum_size = 6144

; Use the Arduino-compatible interface of the WS2812 library.
lib_deps = https://github.com/cpldcpu/light_ws2812.git#4a3a289

; Keep the build small and use the C++ standard supported by this toolchain.
build_flags = -Os -std=gnu++11 -I include

; Check project-owned code, not downloaded framework and library sources.
check_tool = cppcheck
check_skip_packages = yes
check_flags = cppcheck: --enable=warning,style,performance,portability,unusedFunction --inline-suppr --suppress=noExplicitConstructor:*/.pio/libdeps/*
